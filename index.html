<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MediCare Patient Manager</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f9d9a"><link rel="icon" href="icon.svg">
<style>
:root{--t:#0f9d9a;--n:#0b2545;--bg:#f2f7f8;--c:#fff;--tx:#12263a;--m:#6b7c8c;--b:#d9e4e8}
[data-t=dark]{--bg:#0a1626;--c:#10223a;--tx:#e6f0f5;--m:#8ea3b5;--b:#1e3552}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
header{padding-right:110px!important;background:linear-gradient(135deg,var(--n),var(--t));color:#fff;padding:14px 16px;font-weight:700;font-size:18px;position:sticky;top:0;z-index:5}
main{max-width:900px;margin:auto;padding:14px}.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:12px;animation:f .25s}
@keyframes f{from{opacity:0;transform:translateY(6px)}}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--m);padding:10px 2px;font-size:12px}nav button.on{color:var(--t);font-weight:700}
.btn,button.btn{background:var(--t);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:14px;margin:3px}.btn.ghost{background:none;color:var(--t);border:1px solid var(--t)}.btn.red{background:#c0392b}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0 8px}label{font-size:12px;color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat b{font-size:26px;color:var(--t)}.mut,small{color:var(--m)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar span{width:90px;font-size:12px}.bar i{height:12px;background:var(--t);border-radius:6px;transition:width .4s}.bar b{font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap}.item{cursor:pointer}#modal{position:fixed;inset:0;background:#0008;z-index:9;overflow:auto;padding:12px}.dlg{max-width:560px;margin:20px auto}
#lock{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--n),var(--t))}#lock .card{max-width:340px;width:100%}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;z-index:20;pointer-events:none}#toast.show{opacity:1}#toast.err{background:#c0392b}
@media print{header,nav,.btn,#toast{display:none!important}body{background:#fff;color:#000}}
</style></head><body>
<div id="lock" hidden></div>
<div id="app" hidden><header>🩺 MediCare Patient Manager <span class="row" style="float:right"><span id="mr" style="font-weight:400;font-size:13px"></span></span></header><main id="main"></main>
<nav><button data-v="home">🏠<br>Home</button><button data-v="list">👥<br>Patients</button><button onclick="pform()">➕<br>Add</button><button data-v="imp">📥<br>Import</button><button data-v="more">⚙️<br>Settings</button></nav></div>
<div id="modal" hidden></div><div id="toast" role="status"></div>
<script src="app.js"></script></body></html>
